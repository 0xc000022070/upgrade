manifest_version = 5
id = "upgrade.example"
name = "Example plugin"
version = "1.0.0"
upgrade_api = "^2.0.0"
author = "Upgrade"
homepage = "https://github.com/0xc000022070/upgrade"
license = "MIT"
summary = "Minimal template a third-party author can copy"

files = ["lib/shout.luau"]

[runtime]
kind = "luau"
entry = "main.luau"

[capabilities.selected]
api_version = 1
dataset = "selection"
operations = ["get", "propose"]

[permissions]
ui = ["record_action"]

[[contributes.record_actions]]
id = "shout"
title = "SHOUT"

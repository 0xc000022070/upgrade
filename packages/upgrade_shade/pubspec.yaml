name: upgrade_shade
description: Posts the notifications flutter_local_notifications cannot shape, from any of Upgrade's engines.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.luisnquin.upgrade_shade
        pluginClass: UpgradeShadePlugin

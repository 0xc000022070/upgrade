# Vendored copy of re_highlight 0.0.3 (pub.dev, reqable/re-highlight, MIT), the
# pure-Dart port of highlight.js 11, cut down to what Striked reads:
#   lib/src/                 the engine, with the plugin hooks, the language
#                            auto-detection, the HTML and TextSpan renderers
#                            and the flutter dependency removed; the result
#                            walks out as scoped text runs (spans.dart) and a
#                            sub-language list falls back to plain text
#   lib/languages/           32 of the 197 generated grammars, unchanged apart
#                            from their import line; all.dart is Striked's own
# The grammars are generated upstream from highlight.js; a change to one
# belongs there, not here.
name: striked_highlight
description: Syntax highlighting grammars and engine for Striked's code viewer.
version: 0.0.3+striked.1
publish_to: none
environment:
  sdk: ^3.13.0

# Vendored copy of xterm 4.0.0 (pub.dev, TerminalStudio/xterm.dart tag v4.0.0)
# with patches to the alternate-screen scroll path and the touch selection.
# The patched lines are marked "Spectacle patch":
#   lib/src/core/mouse/button.dart          wheel button ids 64-67, not 68-71
#   lib/src/ui/scroll_handler.dart          local pointer position, not global
#   lib/src/terminal_view.dart              keyboardOnTap, a tap need not raise the IME
#   lib/src/ui/render.dart                  selectWord falls back to the cell on a gap,
#                                           and selects by cell as well as by pixel
#   lib/src/ui/gesture/gesture_handler.dart a touch tap acts on the up, not the deadline,
#                                           and a press is anchored at pointer-down
#   lib/src/core/buffer/token.dart          new: the run rule a long press selects by
#   lib/src/core/buffer/buffer.dart         getTokenBoundary, across soft wraps
# Drop this directory and the dependency_overrides entry once a release of
# xterm carries all of them.
name: xterm
description: xterm.dart is a fast and fully-featured terminal emulator for Flutter applications, with support for mobile and desktop platforms.
version: 4.0.0+spectacle.3
homepage: https://github.com/TerminalStudio/xterm.dart
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  convert: ^3.0.0
  meta: ^1.3.0
  quiver: ^3.0.0
  equatable: ^2.0.3
  flutter:
    sdk: flutter
  zmodem: ^0.0.6

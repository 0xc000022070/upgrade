include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    # Generated per run by tool/test-shards.sh from files analyzed directly.
    - test/shards/**
    # Vendored upstream code, linted by its own project.
    - packages/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_use_package_imports

[package]
name = "upgraded"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "The host side of a Upgrade plugin: one binary, exec'd per call."
license = "MIT"
build = "build.rs"

[[bin]]
name = "upgraded"
path = "src/main.rs"

[dependencies]
aes = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
libc = "0.2"
memchr = "2"
miniz_oxide = "0.8"
nix = { version = "0.31.3", default-features = false, features = ["user", "signal", "process", "fs", "term"] }
ocb3 = "0.1"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
imara-diff = { version = "0.2", default-features = false }
tree-sitter = { version = "0.25", default-features = false }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-containerfile = "0.9"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.2"
tree-sitter-go = "0.25"
tree-sitter-graphql = "0.3"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-language = "0.1"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-proto = "0.6"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-scss = "1.0"
tree-sitter-sequel = "0.3"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

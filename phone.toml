[build.android]
app = "dev.luisnquin.striked"
ready = "PERSONAL CONTROL PLANE"
stale = "find lib assets android/app/src packages/striked_luau plugins pubspec.yaml pubspec.lock -type f | sort | xargs cksum | cksum"
run = """
nix develop -c just apk
phone app install -t "$PHONE_ID" build/app/outputs/flutter-apk/app-debug.apk
"""

[android]
state = "prepared"

# Emulators ship with the animation scales at 0, which Flutter reports as
# MediaQuery.disableAnimations and which switches the whole motion layer off.
[android.settings.global]
window_animation_scale = "1"
transition_animation_scale = "1"
animator_duration_scale = "1"

[profiles.dev]
platforms = ["android"]

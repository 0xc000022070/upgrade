default = "pixel_7-api36"

[build.android]
app = "dev.luisnquin.dazzle"
stale = "find lib assets android/app/src packages/dazzle_luau plugins pubspec.yaml pubspec.lock -type f | sort | xargs cksum | cksum"
run = """
nix develop -c just apk
phone app install -t "$PHONE_ID" build/app/outputs/flutter-apk/app-debug.apk
"""

[devices.pixel_7-api36]
state = "prepared"

# Emulators ship with the animation scales at 0, which Flutter reports as
# MediaQuery.disableAnimations and which switches the whole motion layer off.
[devices.pixel_7-api36.settings.global]
window_animation_scale = "1"
transition_animation_scale = "1"
animator_duration_scale = "1"

[devices.faraday]
state = "prepared"

# `dev` is the only device this agent drives; `review` gets installs only.
[profiles.dev]
devices = ["pixel_7-api36"]

[profiles.review]
devices = ["faraday"]

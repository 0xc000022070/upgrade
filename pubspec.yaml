name: upgrade
description: Local-first personal control plane.
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.13.0

dependencies:
  upgrade_luau:
    path: packages/upgrade_luau
  upgrade_highlight:
    path: packages/upgrade_highlight
  upgrade_shade:
    path: packages/upgrade_shade
  crypto: ^3.0.7
  pub_semver: ^2.2.1
  toml: ^0.18.0
  dart_mosh: 0.0.4
  flutter:
    sdk: flutter

  drift: ^2.34.3
  drift_flutter: ^0.3.1
  dartssh2: 4.0.0
  dynamic_color: ^1.7.0
  # Pinned: 11.0.0 raises the android module to compileSdk 37, and the store SDK
  # only carries an android-37.0 directory that AGP 9.1.0 will not accept.
  flutter_secure_storage: 10.3.1
  flutter_riverpod: ^2.6.1
  # Gallery only, no camera.
  image_picker: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.4
  pinenacl: ^0.6.0
  pointycastle: ^4.0.0
  url_launcher: ^6.3.1
  vector_graphics: ^1.2.3
  flterm:
    path: .dart_tool/flterm
  libghostty:
    path: .dart_tool/libghostty
  material_ui: ^1.4.0
  uuid: ^4.6.0
  flutter_local_notifications: ^22.3.0
  flutter_foreground_task: ^11.0.1
  gal: ^2.3.3
  sherpa_onnx: 1.13.8

dependency_overrides:
  libghostty:
    path: .dart_tool/libghostty
  dart_mosh:
    path: .dart_tool/dart_mosh
  dartssh2:
    path: .dart_tool/dartssh2
  pointycastle:
    path: .dart_tool/pointycastle

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  analyzer: ^13.3.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  archive: ^4.0.0
  image: ^4.10.1
  vector_graphics_compiler: ^1.3.0

flutter:
  # The toolbar glyphs are Material Icons, tree-shaken to the ten that are used.
  uses-material-design: true

  assets:
    - lib/builtin_plugins/agents/upgrade.plugin.toml
    - lib/builtin_plugins/agents/main.dart
    - lib/builtin_plugins/drops/upgrade.plugin.toml
    - lib/builtin_plugins/drops/main.dart
    - lib/builtin_plugins/projects/upgrade.plugin.toml
    - lib/builtin_plugins/projects/main.dart
    - lib/builtin_plugins/prompt/upgrade.plugin.toml
    - lib/builtin_plugins/prompt/main.dart
    - plugins/agent-schedules/upgrade.plugin.toml
    - plugins/agent-schedules/main.luau
    - plugins/board/upgrade.plugin.toml
    - plugins/board/main.luau
    - plugins/kanban/upgrade.plugin.toml
    - plugins/kanban/main.luau
    - plugins/templates/phone-card/upgrade.plugin.toml
    - plugins/templates/phone-card/main.luau
    - plugins/templates/phone-card/lib/card.luau
    - plugins/templates/phone-card/fixtures/mounted.json
    - plugins/templates/phone-card/fixtures/refreshed.json
    - plugins/templates/phone-card/AGENTS.md
    - plugins/templates/phone-card/CLAUDE.md
    - plugins/templates/phone-card/wait.sh
    - path: assets/icons/
      transformers:
        - package: vector_graphics_compiler
          # The path-op optimizers load libpath_ops beside the real dart binary, which
          # the nix-wrapped SDK does not have; single-colour paths gain nothing from them.
          args: [--no-optimize-masks, --no-optimize-clips, --no-optimize-overdraw]
    - path: assets/icons/signal/
      transformers:
        - package: vector_graphics_compiler
          args: [--no-optimize-masks, --no-optimize-clips, --no-optimize-overdraw]
    - assets/project_emblems/
    - path: assets/plugin_emblems/
      transformers:
        - package: vector_graphics_compiler
          args: [--no-optimize-masks, --no-optimize-clips, --no-optimize-overdraw]
    - assets/sprites/mascot/
    - assets/linux/catalog.json

  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Bold.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Medium.ttf
          weight: 500
    # The private-use glyphs a shell prompt draws. Symbols only, so it never
    # competes with Plex for a letterform.
    - family: Symbols Nerd Font Mono
      fonts:
        - asset: assets/fonts/nerd_font_symbols/SymbolsNerdFontMono-Regular.ttf

hooks:
  user_defines:
    libghostty:
      source: compile

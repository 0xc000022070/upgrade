name: dazzle
description: Local-first personal control plane.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+112

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  dazzle_luau:
    path: packages/dazzle_luau
  crypto: ^3.0.7
  pub_semver: ^2.2.1
  toml: ^0.18.0
  dart_mosh: 0.0.4
  flutter:
    sdk: flutter

  drift: ^2.34.3
  drift_flutter: ^0.3.1
  dartssh2: ^4.0.0
  dynamic_color: ^1.7.0
  # Pinned, not a caret range. 11.0.0 raised the android module to
  # compileSdk 37 and no android build of this tree succeeds without an
  # android-37 platform; the store SDK only carries a minor-versioned
  # android-37.0 directory, which AGP 9.1.0 does not accept. 10.3.1 is
  # compileSdk 36 and exposes the same read/write/delete API keys.dart uses.
  flutter_secure_storage: 10.3.1
  flutter_svg: ^2.3.0
  flutter_riverpod: ^2.6.1
  # Gallery only, no camera.
  image_picker: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.4
  pinenacl: ^0.6.0
  pointycastle: ^4.0.0
  url_launcher: ^6.3.1
  xterm: ^4.0.0
  uuid: ^4.6.0
  flutter_local_notifications: ^22.3.0
  flutter_foreground_task: ^11.0.1
  gal: ^2.3.3

# xterm 4.0.0 gets the alternate screen's touch scroll wrong twice: wheel
# reports carry ids 68/69 (Shift+wheel) and a row computed from a global
# offset. Claude Code runs on the alternate screen with mouse reporting on, so
# its transcript never saw the scroll. packages/xterm is the release with both
# lines fixed, a keyboardOnTap flag on the view so a tap on the shell is not a
# call for the IME, and a touch selection that follows the finger, stays on the
# cell the press landed on while the shell prints, and takes URLs and paths
# whole, and an onReport apart from onOutput so what the terminal answers on
# its own behalf is not taken for something the user typed; see its pubspec.
dependency_overrides:
  xterm:
    path: packages/xterm

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The toolbar glyphs are Material Icons; the font ships with the
  # framework and is tree-shaken to the ten that are used.
  uses-material-design: true

  assets:
    - lib/plugins/drops/dazzle.plugin.toml
    - lib/plugins/drops/main.dart
    - lib/plugins/projects/dazzle.plugin.toml
    - lib/plugins/projects/main.dart
    - plugins/agent-schedules/dazzle.plugin.toml
    - plugins/agent-schedules/main.luau
    - assets/host/scheduler.py
    - assets/icons/
    - assets/icons/signal/
    - assets/sprites/
    - assets/textures/

  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Bold.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Medium.ttf
          weight: 500
    # The glyphs a shell prompt draws that IBM Plex Mono never claimed to have:
    # git branch, host, nix snowflake, the rest of the Nerd Fonts private-use
    # icon set. Symbols-only, so it never competes with Plex for a letterform.
    - family: Symbols Nerd Font Mono
      fonts:
        - asset: assets/fonts/nerd_font_symbols/SymbolsNerdFontMono-Regular.ttf

name: dazzle
description: Local-first personal control plane.
publish_to: 'none'

version: 1.0.0+128

environment:
  sdk: ^3.13.0

dependencies:
  dazzle_luau:
    path: packages/dazzle_luau
  dazzle_highlight:
    path: packages/dazzle_highlight
  crypto: ^3.0.7
  pub_semver: ^2.2.1
  toml: ^0.18.0
  dart_mosh: 0.0.4
  flutter:
    sdk: flutter

  drift: ^2.34.3
  drift_flutter: ^0.3.1
  dartssh2: ^4.0.0
  dynamic_color: ^1.7.0
  # Pinned: 11.0.0 raises the android module to compileSdk 37, and the store SDK
  # only carries an android-37.0 directory that AGP 9.1.0 will not accept.
  flutter_secure_storage: 10.3.1
  flutter_svg: ^2.3.0
  flutter_riverpod: ^2.6.1
  # Gallery only, no camera.
  image_picker: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.4
  pinenacl: ^0.6.0
  pointycastle: ^4.0.0
  url_launcher: ^6.3.1
  xterm: ^4.0.0
  uuid: ^4.6.0
  flutter_local_notifications: ^22.3.0
  flutter_foreground_task: ^11.0.1
  gal: ^2.3.3

# Nothing in pub applies the patches in packages/xterm/patches, so
# `just xterm-build` writes the patched package into .dart_tool and this points at
# it: a fresh checkout wants that run before `flutter pub get`.
dependency_overrides:
  xterm:
    path: .dart_tool/xterm

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

flutter:
  # The toolbar glyphs are Material Icons, tree-shaken to the ten that are used.
  uses-material-design: true

  assets:
    - lib/plugins/drops/dazzle.plugin.toml
    - lib/plugins/drops/main.dart
    - lib/plugins/projects/dazzle.plugin.toml
    - lib/plugins/projects/main.dart
    - plugins/agent-schedules/dazzle.plugin.toml
    - plugins/agent-schedules/main.luau
    - plugins/board/dazzle.plugin.toml
    - plugins/board/main.luau
    - assets/host/scheduler.py
    - assets/icons/
    - assets/icons/signal/
    - assets/sprites/
    - assets/textures/

  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Bold.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Medium.ttf
          weight: 500
    # The private-use glyphs a shell prompt draws. Symbols only, so it never
    # competes with Plex for a letterform.
    - family: Symbols Nerd Font Mono
      fonts:
        - asset: assets/fonts/nerd_font_symbols/SymbolsNerdFontMono-Regular.ttf

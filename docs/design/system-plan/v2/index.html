<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upgrade — app design v2</title><style>
*{box-sizing:border-box}body{margin:0;background:#050607;color:#E8E8E3;font:12px 'IBM Plex Mono',ui-monospace,monospace}header{position:sticky;top:0;z-index:2;background:#0B0D10;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #2E343C}select,button,a{font:inherit;letter-spacing:.08em;text-transform:uppercase;color:#E8E8E3;background:#111317;border:1px solid #2E343C;border-radius:2px;padding:8px 10px;text-decoration:none}button{cursor:pointer}a{margin-left:auto;color:#9A9FA6}output{color:#6F767F;text-transform:uppercase;letter-spacing:.08em}main{overflow:auto;height:calc(100dvh - 58px)}img{display:block;width:100%;height:auto}@media(max-width:650px){a{margin-left:0}main{height:calc(100dvh - 110px)}}
</style><header><select id="board"></select><button id="prev" aria-label="Previous board">&lt;</button><button id="next" aria-label="Next board">&gt;</button><button id="fit">Fit</button><button id="zoom">1:1</button><output>shipped / extends / proposed tagged per screen</output><a href="upgrade-app.pen" download>.pen</a></header><main><img id="image" alt=""></main><script>
const boards=[["01 / HOME + SPACES","B1"],["02 / SHELL SHEET","B2"],["03 / MACHINES","B3"],["04 / AGENTS + DROPS + PROJECTS","B4"],["05 / PLUGINS + LUAU","B5"],["06 / ANDROID HOME + WIDGETS","B6"],["08 / WORKSPACES + GRID","B8"],["09 / DIRECTION: COLOUR + ICONS","B9"],["10 / SLAB GLYPHS","B10"],["11 / DATA MARKS","B11"],["12 / MASCOT: THE JET","B12"],["13 / TEXTURE: THE HUD IN CARDS","B13"]].map(([name,id])=>({name,src:`exports/${id}.png?v=${Date.now()}`}));
const select=document.querySelector('#board'),image=document.querySelector('#image');
for(const [i,b] of boards.entries()){const o=document.createElement('option');o.value=i;o.textContent=b.name;select.append(o)}
function show(i){const n=(i+boards.length)%boards.length;select.value=n;image.src=boards[n].src;image.alt=boards[n].name;history.replaceState(null,'','#'+(n+1));document.querySelector('main').scrollTo(0,0)}
select.onchange=()=>show(+select.value);document.querySelector('#prev').onclick=()=>show(+select.value-1);document.querySelector('#next').onclick=()=>show(+select.value+1);
document.querySelector('#fit').onclick=()=>image.style.width='100%';document.querySelector('#zoom').onclick=()=>image.style.width=image.naturalWidth+'px';
addEventListener('keydown',e=>{if(e.target===select)return;if(e.key==='ArrowRight')show(+select.value+1);if(e.key==='ArrowLeft')show(+select.value-1)});
const start=+location.hash.slice(1);show(start>0?start-1:0);
</script></html>

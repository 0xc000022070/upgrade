<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upgrade — visual product plan</title><style>
*{box-sizing:border-box}body{margin:0;background:#252b27;color:#edf0e9;font:14px system-ui}header{position:sticky;top:0;z-index:2;background:#101513;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #445044}select,button,a{font:inherit;color:inherit;background:#263029;border:1px solid #526052;border-radius:4px;padding:10px;text-decoration:none}select{max-width:100%}button{cursor:pointer}a{margin-left:auto}main{overflow:auto;height:calc(100dvh - 75px);padding:20px}img{display:block;max-width:none;width:100%;height:auto;margin:auto}output{font-size:12px;color:#afbcaf}@media(max-width:650px){header{gap:6px;padding:8px}a{margin-left:0}main{height:calc(100dvh - 130px);padding:8px}}
</style><header><label for="board">Board</label><select id="board"></select><button id="prev" aria-label="Previous board">←</button><button id="next" aria-label="Next board">→</button><button id="fit">Fit</button><button id="zoom">100%</button><output>Proposed interfaces · existing foundations labeled</output><a href="upgrade-system-plan.pen" download>Download editable .pen</a></header><main><img id="image" alt=""></main><script>
const boards=[{"name": "01 / PRODUCT MAP", "src": "exports/KzC37.png"}, {"name": "02 / HOME + WORKSPACES", "src": "exports/wgIyy.png"}, {"name": "03 / RESOURCE CONTINUITY", "src": "exports/INPiO.png"}, {"name": "04 / MACHINES + EXECUTION", "src": "exports/fio4b.png"}, {"name": "05 / PROGRAMMABLE INTERFACE", "src": "exports/fTUHV.png"}, {"name": "06 / DAILY MANAGEMENT", "src": "exports/iTveq.png"}, {"name": "07 / DELIVERY + PROOF", "src": "exports/wGjLz.png"}];const select=document.querySelector('#board');const image=document.querySelector('#image');for(const [i,b] of boards.entries()){const o=document.createElement('option');o.value=i;o.textContent=b.name;select.append(o)}
function show(i){const index=(i+boards.length)%boards.length;select.value=index;image.src=boards[index].src;image.alt=boards[index].name;history.replaceState(null,'','#'+(index+1));document.querySelector('main').scrollTo(0,0)}
select.onchange=()=>show(Number(select.value));document.querySelector('#prev').onclick=()=>show(Number(select.value)-1);document.querySelector('#next').onclick=()=>show(Number(select.value)+1);document.querySelector('#fit').onclick=()=>image.style.width='100%';document.querySelector('#zoom').onclick=()=>image.style.width='1760px';window.addEventListener('keydown',e=>{if(e.target===select)return;if(e.key==='ArrowRight')show(Number(select.value)+1);if(e.key==='ArrowLeft')show(Number(select.value)-1)});const start=Number(location.hash.slice(1));show(Number.isFinite(start)&&start>0?start-1:0);
</script></html>

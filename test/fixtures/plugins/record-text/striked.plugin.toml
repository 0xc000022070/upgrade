manifest_version = 2
id = "striked.record-text"
name = "Record text"
version = "2.0.0"
striked_api = "^2.0.0"

[runtime]
kind = "luau"
entry = "main.luau"

[datasets.snapshots]
schema_version = 1
quota_bytes = 1048576
quota_records = 1000
export_contract = "text@1"

[capabilities.selected]
api_version = 1
dataset = "selection"
operations = ["get", "propose"]

[capabilities.saved]
api_version = 1
dataset = "self:snapshots"
operations = ["get", "put"]

[permissions]
ui = ["record_action"]

[[contributes.record_actions]]
id = "trim"
title = "TRIM WHITESPACE"

[[contributes.record_actions]]
id = "remember"
title = "SAVE SNAPSHOT"

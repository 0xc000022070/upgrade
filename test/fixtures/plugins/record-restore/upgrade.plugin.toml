manifest_version = 2
id = "upgrade.record-restore"
name = "Record restore"
version = "2.0.0"
upgrade_api = "^2.0.0"

[runtime]
kind = "luau"
entry = "main.luau"

[dependencies]
"upgrade.record-text" = "^2.0.0"

[capabilities.selected]
api_version = 1
dataset = "selection"
operations = ["get", "propose"]

[capabilities.saved]
api_version = 1
dataset = "upgrade.record-text:snapshots"
operations = ["get"]
contract = "text@1"

[permissions]
ui = ["record_action"]

[[contributes.record_actions]]
id = "restore"
title = "RESTORE SNAPSHOT"

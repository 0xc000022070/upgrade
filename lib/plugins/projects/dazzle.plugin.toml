manifest_version = 3
id = "dazzle.projects"
name = "Projects"
version = "1.0.0"
dazzle_api = "^2.0.0"

[runtime]
kind = "native"
entry = "main.dart"

[dependencies]
"dazzle.drops" = "^1.0.0"

[exports]
projects = "projects@1"
goals = "goals@1"
project_notes = "project-notes@1"

[services]
projects = "projects@1"
goals = "goals@1"
project_notes = "project-notes@1"
items = "items@1"
attachments = "attachments@1"
item_notes = "item-notes@1"
"host.capture_targets" = "capture-targets@1"
"host.dispatch" = "dispatch@1"
"host.workspaces" = "workspaces@1"

[datasets.projects]
schema_version = 1
service = "projects"

[datasets.goals]
schema_version = 1
service = "goals"

[datasets.notes]
schema_version = 1
service = "project_notes"

[contributes]
surfaces = ["navigation.page", "project.detail", "capture.targets"]

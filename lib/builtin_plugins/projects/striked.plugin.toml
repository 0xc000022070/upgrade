manifest_version = 3
id = "striked.projects"
name = "Projects"
emblem = "banner"
purpose = "Organize captured work into projects and goals."
version = "1.0.0"
striked_api = "^2.0.0"

[runtime]
kind = "native"
entry = "main.dart"

[dependencies]
"striked.drops" = "^1.0.0"

[exports]
projects = "projects@1"
goals = "goals@1"
project_notes = "project-notes@1"

[services]
projects = "projects@1"
goals = "goals@1"
project_notes = "project-notes@1"
items = "items@1"
attachments = "attachments@1"
item_notes = "item-notes@1"
"host.capture_targets" = "capture-targets@1"
"host.dispatch" = "dispatch@1"
"host.workspaces" = "workspaces@1"

[datasets.projects]
schema_version = 1
service = "projects"

[datasets.goals]
schema_version = 1
service = "goals"

[datasets.notes]
schema_version = 1
service = "project_notes"

[contributes]
surfaces = ["navigation.page", "project.detail", "capture.targets"]

[[contributes.pages]]
id = "main"
title = "Projects"
surface = "navigation.page"
pinned_by_default = true

[[contributes.widgets]]
id = "next-action"
title = "Next action"
surface = "project.next_action"
locations = ["home.card"]
default_location = "home.card"
default_size = "auto"
sizes = [{ id = "auto", title = "Automatic", min_width = 280, max_width = 720 }]

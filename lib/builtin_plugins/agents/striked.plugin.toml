manifest_version = 3
id = "striked.agents"
name = "Agents"
emblem = "eye"
purpose = "Show what the agents are doing and how much of each plan is left."
version = "1.0.0"
striked_api = "^2.0.0"

[runtime]
kind = "native"
entry = "main.dart"

[contributes]

[[contributes.widgets]]
id = "agents"
title = "Agents"
surface = "home.agents"
locations = ["home.card"]
default_location = "home.card"
default_size = "auto"
sizes = [{ id = "auto", title = "Automatic", min_width = 240, max_width = 1100 }]
